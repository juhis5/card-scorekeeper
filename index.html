<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Rommi" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#16100c" />
    <title>Rommi</title>
    <script>
      // Same lists as src/lib/platform/themes.ts: the theme is on before the first paint.
      ;(function () {
        var themes = [
          'captain',
          'captain-light',
          'dark',
          'light',
          'jani',
          'nord',
          'dracula',
          'solarized',
        ]
        var lightThemes = ['captain-light', 'light', 'solarized']
        var stored = localStorage.getItem('theme')
        var theme = themes.indexOf(stored) >= 0 ? stored : 'captain'
        var root = document.documentElement
        root.classList.toggle('dark', lightThemes.indexOf(theme) < 0)
        if (theme !== 'dark' && theme !== 'light') root.classList.add('theme-' + theme)
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
