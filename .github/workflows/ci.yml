# Mirrors the local git hooks (see the git-workflow skill), but never auto-fixes.
# Actions are pinned by commit SHA, tag in the trailing comment. Bump them on purpose and check
# each major still runs on a Node version GitHub's runners support (docs/TOOLCHAIN.md).
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: # run by hand on any branch

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0, reads "packageManager"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc # Node 24 LTS
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:check # eslint without --fix, so fixable violations fail too
      - run: pnpm format:check
      - run: pnpm test:run
      - run: pnpm test:api # fully mocked, no emulator or credentials
      - run: pnpm test:api-load # compiles /api like Vercel and imports it in Node's ESM loader
      - run: pnpm build # typecheck + build

  # The rules suite, so a rules regression can't merge, and the integration suite. Both run
  # against the emulator, which needs Java.
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:rules
      - run: pnpm test:integration

  # Chromium and Firefox against the emulators and a production build. Playwright's WebKit is
  # quarantined for two-client sync (see tests/e2e/playwright.config.ts). No retries.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm install --frozen-lockfile
      # The browsers are cached per Playwright version; the system libraries they need still install.
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: browser-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-firefox
      - if: steps.browser-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium firefox
      - if: steps.browser-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium firefox
      - run: pnpm test:e2e:ci # builds, previews, and runs Playwright inside emulators:exec
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # Screenshots, compared in Playwright's Linux image, where the baselines are made
  # (`pnpm test:visual:update`) and fonts render the same. Keep the tag equal to @playwright/test.
  visual:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright test -c tests/e2e --project=visual
        env:
          CI: '1'
          VISUAL: '1'
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-report
          path: playwright-report/
          retention-days: 14
