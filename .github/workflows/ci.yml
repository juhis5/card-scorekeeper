# CI — mirrors the local git hooks (see the git-workflow skill).
# Activates once the app is scaffolded (scripts + pnpm-lock.yaml exist).
# Versions are directional — verify latest.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # reads the "packageManager" field
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc # single source of truth (Node 24 LTS)
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test:run
      - run: pnpm test:api # /api/count — fully mocked (Admin SDK + Gemini), no emulator/creds
      - run: pnpm build # runs vue-tsc (typecheck) + build

  # Firestore rules are the security boundary — run the emulator rules suite in CI so a rules
  # regression can't merge (see firestore-realtime / tdd). Separate job: it needs Java for the
  # emulator (firebase-tools is a devDep, pulled by the install below).
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21' # matches local (see docs/TOOLCHAIN.md); emulator JAR needs a JDK
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:rules # firebase emulators:exec 'vitest run --config vitest.rules.config.ts'
      # Real client SDK (browser build) vs the emulator — see vitest.integration.config.ts.
      - run: pnpm test:integration
      # NOTE: test:e2e (Playwright + emulator + app server) is intentionally NOT in CI — run
      # locally (see docs/BUILD_REPORT.md). Its live-sync spec excludes Playwright-WebKit
      # (documented flake).
