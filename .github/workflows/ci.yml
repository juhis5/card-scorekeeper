# CI — mirrors the local git hooks (see the git-workflow skill), but never auto-fixes.
# Actions are pinned by commit SHA (tag in the trailing comment). Bump them on purpose and check
# each major still runs on a Node version GitHub's runners support — see docs/TOOLCHAIN.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # run on any branch by hand, so long-lived branches aren't unverified

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0, reads "packageManager"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc # single source of truth (Node 24 LTS)
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:check # eslint without --fix, so fixable violations fail too
      - run: pnpm format:check
      - run: pnpm test:run
      - run: pnpm test:api # /api/count — fully mocked (Admin SDK + Gemini), no emulator/creds
      - run: pnpm build # runs vue-tsc (typecheck) + build

  # Firestore rules are the security boundary — run the emulator rules suite in CI so a rules
  # regression can't merge (see firestore-realtime / tdd). Separate job: it needs Java for the
  # emulator (firebase-tools is a devDep, pulled by the install below).
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21' # the Firestore emulator JAR needs a JDK
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:rules # firebase emulators:exec 'vitest run --config vitest.rules.config.ts'
      # Real client SDK (browser build) vs the emulator — see vitest.integration.config.ts.
      - run: pnpm test:integration

  # Two real browsers against the emulators and a production build: a score entered on one
  # client appears live on the other. Chromium + Firefox only: Playwright-WebKit's live-sync run
  # is a documented flake (see playwright.config.ts). No retries, so a flake fails the job.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox
      - run: pnpm test:e2e:ci # builds, previews, and runs Playwright inside emulators:exec
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
