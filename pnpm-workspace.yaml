allowBuilds:
  '@firebase/util': true
  # The `prepare` script (scripts/prepare.js) is a source-repo build step whose file isn't even
  # present in the published tarball — the package ships prebuilt dist/ output (verified: dist/
  # already contains node/index.mjs + node/node.d.ts as installed). Nothing to build; denied like
  # sharp below, for the same "nothing here calls it" reason.
  '@google/genai': false
  # Its install script only downloads the CLI binary, which already arrives through its per-platform
  # optional package (@sentry/cli-darwin, -linux-x64, ...).
  '@sentry/cli': false
  # Its install script only checks the binary that arrives through its per-platform optional
  # package (@esbuild/darwin-arm64, -linux-x64, ...); tsx and vite run it without the script.
  esbuild: false
  protobufjs: true
  re2: true
  # sharp is pulled in only as vite-plugin-pwa's OPTIONAL peer `@vite-pwa/assets-generator` (its
  # icon-generation CLI, which this project doesn't use — icons are committed PNGs, generated
  # once and not regenerated by any script here). Denied: nothing in this repo calls it, so its
  # native build step would be pure waste.
  sharp: false
  vue-demi: true
minimumReleaseAgeExclude:
  - lint-staged@17.2.0
