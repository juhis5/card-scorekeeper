allowBuilds:
  '@firebase/util': true
  protobufjs: true
  re2: true
  # sharp is pulled in only as vite-plugin-pwa's OPTIONAL peer `@vite-pwa/assets-generator` (its
  # icon-generation CLI, which this project doesn't use — icons are committed PNGs, generated
  # once and not regenerated by any script here). Denied: nothing in this repo calls it, so its
  # native build step would be pure waste.
  sharp: false
  vue-demi: true
minimumReleaseAgeExclude:
  - lint-staged@17.2.0
